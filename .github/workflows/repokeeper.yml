name: RepoKeeper Implementation Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  implement:
    runs-on: [self-hosted, repokeeper]
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent-todo') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/repokeeper go'))

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run RepoKeeper Agent
        uses: shenxianpeng/repokeeper@v1
        with:
          module: agent
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          llm_base_url: 'https://api.deepseek.com'
