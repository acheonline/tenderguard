# repokeeper.yml
style:
  # Правила кода текстом, чтобы LLM их учитывал
  code_style: |
    Go 1.22, только stdlib (без внешних зависимостей без согласования).
    Ошибки оборачивать через %w, не игнорировать.
    context.Context первым аргументом в функциях с I/O.
    Логи только через slog, без секретов и ПДн.
    Новая логика = табличные тесты. Сеть в юнит-тестах запрещена.
    Не удалять и не ослаблять существующие тесты ради прохождения CI.
    Коммиты в стиле Conventional Commits.
  # Go-специфичные инструменты
  testing: "go test"
  formatting: "gofmt"
  linting: true

pr:
  # Лимит файлов в одном PR
  max_files_per_pr: 10
  # Требовать changelog (можно включить при необходимости)
  require_changelog: false

# Команды, которые агент должен запускать перед созданием PR
agent:
  verify_commands:
    - "go build ./..."
    - "go test -race ./..."
    - "golangci-lint run"
